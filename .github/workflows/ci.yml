name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-gate:
    name: Backend Quality, Security & API Contract Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifestyle_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_local_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies with lockfile
        working-directory: backend
        run: npm ci

      - name: Forbidden-dependency guard (ADR-039)
        run: node scripts/check-forbidden.mjs

      - name: Code style & lint
        working-directory: backend
        run: |
          npm run format:check
          npm run lint

      - name: Strict TypeScript check
        working-directory: backend
        run: npm run typecheck

      - name: OpenAPI drift check
        working-directory: backend
        run: |
          npm run openapi:generate
          git diff --exit-code ../docs/api/openapi.yaml

      - name: Initialize database roles
        run: |
          PGPASSWORD=postgres_local_pass psql -h localhost -U postgres -d lifestyle_dev -f backend/src/infrastructure/database/postgres/init-roles.sql

      - name: Migration reversibility check (up -> down -> up)
        working-directory: backend
        env:
          DATABASE_MIGRATION_URL: postgresql://lifestyle_migrator:migrator_local_pass@localhost:5432/lifestyle_dev
        run: |
          npm run migrate:up
          npm run migrate:down
          npm run migrate:up

      - name: Unit, integration & security tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://lifestyle_app:app_local_pass@localhost:5432/lifestyle_dev
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-secret-at-least-32-characters-long-for-hs256
          OTP_HMAC_SECRET: test-otp-secret-at-least-32-characters-long
          LOG_LEVEL: silent
        run: npm test

      - name: Production dependency security audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  mobile-gate:
    name: Flutter Static Analysis & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter stable channel
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter static analysis
        run: flutter analyze --fatal-infos

      - name: Flutter tests
        run: flutter test --coverage
