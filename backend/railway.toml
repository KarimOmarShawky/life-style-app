# Railway deployment.
#
# Set the service's Root Directory to `backend` in the Railway dashboard: this
# repository holds the API and, later, a Flutter app, and the image should not
# be rebuilt because a Dart file changed.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run before the server starts, in the same command, so an instance
# can never serve traffic against a schema it does not expect. This is safe with
# several instances starting at once: the runner takes a session-level advisory
# lock, so the second one waits and then finds nothing to do. That lock is also
# why DATABASE_URL must be the direct Neon endpoint and not the -pooler one —
# PgBouncer's transaction pooling does not preserve session state.
startCommand = "npm run migrate:prod && node dist/server.js"

# /readiness rather than /health: it checks PostgreSQL, so a new deployment does
# not take traffic until it can actually serve it. It returns 200 when MongoDB or
# Redis are down — those degrade features rather than removing the service — and
# 503 only when PostgreSQL is unreachable, which is the one dependency every
# authenticated request needs.
healthcheckPath = "/readiness"
healthcheckTimeout = 120

# A crash loop should stop and stay visible rather than retry forever and bury
# the cause under restarts.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
