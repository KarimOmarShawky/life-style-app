name: lifestyle_mobile
description: Native Flutter client for the LifeStyle API.
publish_to: none
version: 1.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^10.0.0
  http: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

dependency_overrides:
  win32: ^5.5.4

flutter:
  uses-material-design: true
