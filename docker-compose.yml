# ==============================================================================
# docker/docker-compose.yml
#
# Implements Section 19.4 & ADR-001: Local Development Infrastructure.
# Services: PostgreSQL 16, Redis 7, Mailpit (local email capture), API, Worker.
# 
# Critical Rule (D-02, ADR-001, ADR-039):
# Document stores are strictly excluded from this compose environment.
# ==============================================================================

name: "${LOCAL_PROJECT_NAME:?Generate fresh private setup first}"

services:
  # Primary Relational Store (Source of Truth)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifestyle_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOCAL_POSTGRES_PASSWORD:?Generate fresh private setup first}"
      LIFESTYLE_FRESH_BOOTSTRAP: fresh-local-or-ci-only
      LIFESTYLE_APP_PASSWORD: "${LOCAL_APP_PASSWORD:?Generate fresh private setup first}"
      LIFESTYLE_MIGRATOR_PASSWORD: "${LOCAL_MIGRATOR_PASSWORD:?Generate fresh private setup first}"
      LIFESTYLE_MAINTENANCE_PASSWORD: "${LOCAL_MAINTENANCE_PASSWORD:?Generate fresh private setup first}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/infrastructure/database/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifestyle_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Temporary / Infrastructure State (Rate limiting, OTPs, queues)
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Local Email Capture & Testing Tool
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP server
      - "127.0.0.1:8025:8025" # Web UI
    restart: unless-stopped

  # One-shot, locked, versioned migrations. API/worker never run schema DDL.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "migrate:up"]
    environment:
      DATABASE_MIGRATION_URL: "${LOCAL_DATABASE_MIGRATION_URL:?Generate fresh private setup first}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # LifeStyle API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      DATABASE_URL: "${LOCAL_DATABASE_URL:?Generate fresh private setup first}"
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: "${LOCAL_JWT_ACCESS_SECRET:?Generate fresh private setup first}"
      OTP_HMAC_SECRET: "${LOCAL_OTP_HMAC_SECRET:?Generate fresh private setup first}"
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

  # Background Queue & Worker Service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: "${LOCAL_DATABASE_URL:?Generate fresh private setup first}"
      DATABASE_MAINTENANCE_URL: "${LOCAL_DATABASE_MAINTENANCE_URL:?Generate fresh private setup first}"
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: "${LOCAL_JWT_ACCESS_SECRET:?Generate fresh private setup first}"
      OTP_HMAC_SECRET: "${LOCAL_OTP_HMAC_SECRET:?Generate fresh private setup first}"
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

volumes:
  postgres_data:
  redis_data:
