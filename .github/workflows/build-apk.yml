name: Build Android APK

# Builds the Flutter app on GitHub's runners so the ~500 MB Gradle and Android
# dependency download never touches a local machine. The finished APK is
# attached to the run as an artifact and to a Release when a tag is pushed.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Only `mobile/**`, deliberately. This workflow was also triggered by changes
    # to itself, which meant it ran on the very first commit, before a Flutter
    # app existed, and failed. A workflow that cannot succeed should not run:
    # a permanently red check trains everyone to ignore the red.
    # Use workflow_dispatch to test a change to this file before `mobile/` exists.
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: lifestyle-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
